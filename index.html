<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}</style></head><body><title>CMDR Rankings</title><link data-keep="" rel="preconnect" href="https://fonts.googleapis.com"><link data-keep="" rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link data-keep="" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet"><style id="css">:root{
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#15171C; --muted:#5D6470; --faint:#8A919C; --line:#E0E4E9;
  --red:#E62542; --red-ink:#C4122F; --maroon:#8E1B2E; --red-wash:#FDECEF;
  --green:#1D7F46; --green-bg:#E4F3EA; --yellow:#9A7300; --yellow-bg:#FBF1D2;
  --focus:#1B5FD6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101216; --card:#181B21; --ink:#ECEEF1; --muted:#A6ADB8; --faint:#7C8490; --line:#2A2F37;
  --red:#FF4560; --red-ink:#FF6A7F; --maroon:#E07A8A; --red-wash:#2A161A;
  --green:#5CCB8A; --green-bg:#15281D; --yellow:#E6BF4C; --yellow-bg:#2B2514; --focus:#7FA8FF;}}
:root[data-theme="dark"]{
  --paper:#101216; --card:#181B21; --ink:#ECEEF1; --muted:#A6ADB8; --faint:#7C8490; --line:#2A2F37;
  --red:#FF4560; --red-ink:#FF6A7F; --maroon:#E07A8A; --red-wash:#2A161A;
  --green:#5CCB8A; --green-bg:#15281D; --yellow:#E6BF4C; --yellow-bg:#2B2514; --focus:#7FA8FF;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.flag{height:6px;background:var(--red)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 64px}
header{padding:22px 0 0}
.eyebrow{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted);font-size:15px}
.eyebrow img{height:48px;width:auto;display:block}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px}
h1{font:700 clamp(40px,7vw,64px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:-.01em}
.credit{display:flex;align-items:center;gap:10px;padding-bottom:6px;text-align:right}
.credit img{height:42px;width:auto;display:block}
.credit p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap}
.credit p b{color:var(--ink);font-weight:600}
.credit small{display:block;font:500 12px/1.3 "Barlow Condensed",sans-serif;color:var(--faint);margin-top:2px;letter-spacing:.02em}
.hog{height:3px;background:var(--red);margin:12px 0 18px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;white-space:nowrap;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.seg[hidden]{display:none}
.search{flex:1 1 200px;min-width:180px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  padding:8px 12px;font:inherit;color:var(--ink)}
.count{font-size:13px;color:var(--faint);margin:0 0 8px}
.colhead,.rowbtn{display:grid;grid-template-columns:52px 1fr 150px 96px 18px;gap:12px;align-items:center}
.colhead{font-size:12px;font-weight:600;color:var(--faint);padding:0 14px 6px}
.colhead span:nth-child(3),.colhead span:nth-child(4){text-align:right}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.rowbtn{width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer}
.rowbtn:hover{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.rank{font:600 26px/1 "Barlow Condensed",sans-serif;color:var(--muted);text-align:center}
.item.top .rank{color:var(--red-ink)}
.who{min-width:0}
.teamname{font-weight:600;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:13px;color:var(--muted)}
.mk{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font:700 11px/1 Barlow,sans-serif;
  color:#fff;margin-right:5px;vertical-align:1px}
.mk.w{background:var(--red)} .mk.m{background:var(--maroon)}
.split{text-align:right;font-size:14px;color:var(--muted)}
.cnt{display:inline-block;white-space:nowrap;margin-left:6px;font-size:12px;font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
.split b{font-weight:500} .split i{font-style:normal;color:var(--faint);margin:0 4px}
.pts{text-align:right;font:700 22px/1 "Barlow Condensed",sans-serif}
.chev{color:var(--faint);transition:transform .15s}
.rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.panel{padding:4px 14px 16px 78px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.panel.single{grid-template-columns:1fr}
.ath{border-left:3px solid var(--red);padding:2px 0 2px 12px}
.ath.m{border-color:var(--maroon)}
.ath h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.ath h3 .num{font-size:18px}
.ath h4{margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--faint)}
.ev{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;font-size:13px;
  padding:4px 8px;border-radius:5px;margin-bottom:2px}
.ev.cur{background:var(--green-bg);box-shadow:inset 3px 0 var(--green)}
.ev.prev{background:var(--yellow-bg);box-shadow:inset 3px 0 var(--yellow)}
.ev.out{background:none;box-shadow:none;color:var(--faint);text-decoration:line-through}
.ev .yr{font-size:12px;color:var(--muted)} .ev.out .yr{color:var(--faint)}
.ev .p{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.evlink{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.evlink:hover{color:var(--red-ink)}
.none{font-size:13px;color:var(--faint);margin:2px 0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .lc::before{background:var(--green)} .legend .lp::before{background:var(--yellow)}
/* events */
.evhead,.evbtn{display:grid;grid-template-columns:150px 1fr 70px 18px;gap:12px;align-items:center}
.evbtn{width:100%;border:0;background:none;padding:11px 14px;text-align:left;cursor:pointer}
.evbtn:hover{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.evdate{font-family:"Barlow Condensed",sans-serif;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.evname{font-weight:600}
.tag{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.nteams{text-align:right;font-size:13px;color:var(--muted)}
.evtable{margin:0 14px 14px;border-collapse:collapse;width:calc(100% - 28px);font-size:14px}
.evtable td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
.evtable td:first-child{width:44px;font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--muted);text-align:center}
.evtable td:last-child{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.evtable small{display:block;color:var(--faint);font-size:12px}
.evtable tr.hl td{background:var(--red-wash)}
.evtable tr.hl td:first-child{box-shadow:inset 3px 0 var(--red)}
.empty{padding:28px 14px;color:var(--muted);text-align:center}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
@media (max-width:680px){
  .wrap{padding:0 12px 48px}
  .titlerow{flex-direction:column;align-items:flex-start}
  .credit{text-align:left}.credit p{white-space:normal}
  .colhead,.rowbtn{grid-template-columns:36px 1fr 74px 14px}
  .colhead span:nth-child(3),.rowbtn .split{display:none}
  .rank{font-size:21px}
  .teamname{white-space:normal;overflow:visible}
  .panel{grid-template-columns:1fr;padding-left:14px}
  .evhead,.evbtn{grid-template-columns:1fr 56px 14px}
  .evdate{grid-column:1/-1;order:-1;font-size:13px;margin-bottom:-6px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* ---- entering results ---- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.addbtn[hidden],.adminbar[hidden],.more[hidden]{display:none}
.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:-4px 0 14px;font-size:13px;color:var(--muted)}
.adminbar b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:min(560px,calc(100vw - 32px));z-index:30;box-shadow:0 6px 24px rgb(0 0 0/.2)}
.toast[hidden]{display:none}
.mtag{color:var(--red-ink);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.fbtn{margin-left:8px;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;vertical-align:1px}
.fbtn:hover{color:var(--red-ink);border-color:var(--red)}
.ev.out .fbtn{text-decoration:none}
.regtag{display:inline-block;font-size:12px;font-weight:600;color:var(--green);background:var(--green-bg);border-radius:4px;padding:0 7px}
.regtag.no{color:var(--muted);background:none;border:1px solid var(--line);font-weight:500}
.fadd{margin-top:6px;border:0;background:none;padding:2px 0;font-size:12px;font-weight:600;color:var(--red-ink);cursor:pointer}
.evtools{display:flex;gap:8px;justify-content:flex-end;margin:0 14px 14px}
.evtable tr.nc td{color:var(--faint)}
dialog.entry{width:min(940px,calc(100vw - 24px));max-height:calc(100vh - 24px);border:0;border-radius:12px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgb(0 0 0/.3)}
dialog.entry::backdrop{background:rgb(15 17 22/.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg h2{margin:0;font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.dlg .body{padding:16px 20px;overflow:auto;display:grid;gap:16px}
.dlg footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.dlg footer .sum{margin-right:auto;font-size:13px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:auto 1fr 150px 150px;gap:12px;align-items:end}
.field{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.dtable input,.dtable select{font:inherit;font-size:14px;font-weight:400;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:130px;resize:vertical}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.field > .seg{justify-self:start}
.paste{border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.paste .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--faint);margin:0}
.err{font-size:13px;color:var(--red-ink);margin:0}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable th{font-size:12px;font-weight:600;color:var(--faint);text-align:left;padding:0 6px 6px}
.dtable td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
.dtable td.r input{width:56px;text-align:center}
.dtable td.p input{width:84px;text-align:right}
.dtable .each{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;padding-top:12px;white-space:nowrap}
.dtable .lab{padding-top:12px}
.dtable .lab .hint{display:block;margin-top:3px}
.dtable .who2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.no{background:var(--yellow-bg);color:var(--yellow)}
.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:8px}
.x:hover{color:var(--red-ink)}
@media (max-width:680px){
  .fgrid{grid-template-columns:1fr 1fr}
  .fgrid .wide{grid-column:1/-1}
  .dtable thead{display:none}
  .dtable tr{display:grid;grid-template-columns:64px 1fr 32px;gap:4px 8px;border-top:1px solid var(--line);padding:8px 0}
  .dtable td{border:0;padding:2px}
  .dtable td.lab{grid-column:2/3;padding-top:8px}
  .dtable td.match{grid-column:1/-1}
  .dtable td.x2{grid-column:3;grid-row:1}
  .dtable td.p{grid-column:1/3}
  .dtable td.p input{width:100%}
  .dtable .each{grid-column:3;padding-top:8px}
}

function personFinder(){
  const D = DATA[CUR], byName = new Map();
  D.people.forEach((p, i) => { const k = fold(p[0]); (byName.get(k) || byName.set(k, []).get(k)).push(i); });
  const inPair = new Set(D.pairs.flatMap(x => [x[0], x[1]]));
  return {
    find(name, g){
      const c = (byName.get(fold(name)) || []).filter(i => !g || D.people[i][1] === g);
      c.sort((a, b) => (inPair.has(b) - inPair.has(a)) || (D.people[b][2] - D.people[a][2]) || (D.people[b][3] - D.people[a][3]));
      return c.length ? c[0] : -1;

    add(name, g, can){ const i = D.people.push([name.trim(), g, can || NAT[akey(name)] === 1 ? 1 : 0, 0, 0, []]) - 1;

  };
}

function applyManual(){
  const D = DATA[CUR];

  if(replaced.size) D.people.forEach((p, i) => {
    if(i >= BASE.n) return;
    const keep = BASE.p[i][2].filter(e => !replaced.has(String(e[5])));
    if(keep.length !== BASE.p[i][2].length) touched.add(i);

  D.people.forEach((p, i) => { if(p[2] && !REG.has(akey(p[0]))) REG.set(akey(p[0]), i); });   // unregistered Canadians also get 25%

      const eid = "m" + m.id, teams = [];

        for(const i of ids){ (awards.get(i) || awards.set(i, []).get(i)).push([1, 1, m.name, each, 0, eid, CUR]); touched.add(i); }
        const note = ids.length ? `${ids.map(i => D.people[i][0]).join(", ")} · ${f3(each)} each`
          : "";
        teams.push([t.rank, t.label, note, t.pts, ids]);
      }
      teams.sort((a, b) => a[0] - b[0] || b[3] - a[3]);
      evs.push([eid, m.start ? dateLabel(m.start, m.end) : "Date to confirm", m.start || "9999", m.name,
                m.g === "M" ? "Men's fours" : "Women's fours", "F", teams, 1]);
      continue;
    }
    const eid = m.replaces ? String(m.replaces) : "m" + m.id, season = m.season || CUR, teams = [];
    for(const t of m.teams){

      for(const i of ids){
        const nm = D.people[i][0], pts = t.ath && t.ath[nm] != null ? t.ath[nm] : r3(t.pts * MD_SHARE);
        (awards.get(i) || awards.set(i, []).get(i)).push([0, season === CUR ? 1 : 0, m.name, pts, 0, eid, season]);
        touched.add(i);
      }
      const label = ids.length === 2 ? `${D.people[ids[0]][0]} / ${D.people[ids[1]][0]}` : ids.length ? D.people[ids[0]][0] : t.label;
      const note = ids.length === 2 ? "" : ids.length ? "Partner not entered" : "Not counted in the rankings";
      teams.push([t.rank, label, note, t.pts, ids]);
    }
    teams.sort((a, b) => a[0] - b[0] || b[3] - a[3]);
    evs.push([eid, m.start ? dateLabel(m.start, m.end) : (m.dateLabel || "Date to confirm"), m.start || (m.replaces ? "" : "9999"),
              m.name, m.tag || "Mixed doubles", "D", teams, m.replaces ? 2 : 1]);
  }
  const f4 = new Map();
  for(const o of FOURS){ const i = get(o.who, o.g, 0); touched.add(i); (f4.get(i) || f4.set(i, []).get(i)).push(o); }
  D.events = BASE.events.filter(e => !replaced.has(String(e[0]))).concat(evs)
    .sort((a, b) => (b[2] > a[2]) - (b[2] < a[2]) || String(b[0]).localeCompare(String(a[0])));
  for(const i of touched){
    const p = D.people[i];
    let base = (i < BASE.n ? BASE.p[i][2].filter(e => !replaced.has(String(e[5]))) : []).map(e => e.slice());
    const extra = (awards.get(i) || []).map(e => e.slice());
    for(const o of f4.get(i) || []){
      if(o.replaces){
        const k = base.findIndex(e => e[0] === 1 && e[2] === o.replaces.name && e[6] === o.replaces.season && Math.abs(e[3] - o.replaces.pts) < 0.0006);
        if(k >= 0) base.splice(k, 1);
      }
      extra.push([1, o.season === CUR ? 1 : 0, o.name, o.pts, 0, 0, o.season, o.id]);

    const pool = base.concat(extra).sort((a, b) => b[3] - a[3]);

    const ok = [];
    for(const e of pool){

      if(e[0] === 1 && ++fours > 2){ if(e[1]){ e.capped = 1; ok.push(e); } continue; }
      ok.push(e);

    let n = 0;
    for(const e of ok) e[4] = !e.capped && n < BEST ? (n++, 1) : 0;
    const used = ok.filter(e => e[4]);
    p[3] = Math.round(used.reduce((s, e) => s + e[3], 0) * 1e6) / 1e6;
    p[4] = used.length;

function seg(el, key, opts){
  el.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if(!b) return;
    S[key] = b.dataset.v; S.open = null; S.hl = null; S.limit = 150; draw(); };
}
function ranked(rows){
  let prev = null, r = 0;
  return rows.map((x, i) => { const p = f3(x.t); if(p !== prev){ r = i + 1; prev = p; } return {...x, rank: r}; });
}
function evRows(p, kind){
  const evs = p[5].filter(e => e[0] === kind).slice().sort((a, b) => b[4] - a[4] || b[3] - a[3]);
  if(!evs.length) return `<p class="none">None</p>`;
  return evs.map(e => {
    const cls = e[4] ? (e[1] ? "cur" : "prev") : "out";
    const nm = e[5] ? `<button type="button" class="evlink" data-eid="${esc(e[5])}" data-who="${p._i}">${esc(e[2])}</button>` : esc(e[2]);
    const ed = kind === 1 && EDIT && S.season === CUR && !String(e[5]).startsWith("m")
      ? `<button type="button" class="fbtn" data-f4="${p._i}" data-ov="${esc(e[7] || "")}" data-rn="${esc(e[2])}" data-rs="${esc(e[6])}" data-rp="${e[3]}" title="${e[7] ? "Change" : "Replace"} this result">${e[7] ? "Edited" : "Replace"}</button>` : "";
    return `<div class="ev ${cls}"><span>${nm}${ed}</span><span class="yr">${e[6]}</span><span class="p">${f3(e[3])}</span></div>`;
  }).join("");
}
function athPanel(p, cls){
  const mk = p[1] === "F" ? "w" : "m";
  return `<section class="ath ${cls || ""}"><h3><span><i class="mk ${mk}">${mk.toUpperCase()}</i>${esc(p[0])}<span class="cnt">${p[4]} of 7</span></span><span class="num">${f3(p[3])}</span></h3>
    <h4>Mixed doubles</h4>${evRows(p, 0)}<h4>Four-person</h4>${evRows(p, 1)}${EDIT && S.season === CUR ? `<button type="button" class="fadd" data-f4="${p._i}">+ Add four-person result</button>` : ""}</section>`;
}

function draw(){
  const D = DATA[S.season];
  D.people.forEach((p, i) => p._i = i);
  seg($("season"), "season", SEASONS.map(s => [s, s]));
  seg($("view"), "view", [["pairs", "Pairs"], ["F", "Women"], ["M", "Men"], ["events", "Events"]]);
  $("season").hidden = SEASONS.length < 2;
  seg($("evtype"), "evtype", [["D", "Mixed doubles"], ["F", "Four-person"]]);
  $("evtype").hidden = S.view !== "events";
  seg($("scope"), "scope", [["can", "Canadian"], ["all", "All"]]);
  $("scope").hidden = true;
  $("legend").hidden = S.view === "events";
  const q = fold(S.q);
  let html = "", total = 0;

  if(S.view === "events"){
    $("head").innerHTML = `<div class="evhead colhead"><span>Date</span><span>Event</span><span style="text-align:right">Teams</span><span></span></div>`;
    let evs = (META.readonly ? D.events.filter(e => !e[2] || e[2] >= SEASON_FROM) : D.events).filter(e => e[5] === S.evtype);
    if(q) evs = evs.filter(e => fold(e[3]).includes(q) || e[6].some(t => fold(t[1] + " " + t[2]).includes(q)));
    total = evs.length;
    const show = evs.slice(0, S.limit);
    if(S.open != null && !show.some(e => String(e[0]) === S.open)) show.push(...D.events.filter(e => String(e[0]) === S.open));
    html = show.map(e => {
      const id = String(e[0]), open = S.open === id, manual = e[7] === 1 || e[7] === 2;
      const tools = !(open && EDIT && S.season === CUR) ? "" : e[7] === 1
        ? `<div class="evtools"><button type="button" class="btn" data-edit="${esc(id)}">Edit results</button><button type="button" class="btn danger" data-del="${esc(id)}">Delete event</button></div>`
        : e[7] === 2 ? `<div class="evtools"><button type="button" class="btn" data-edit="${esc(id)}">Edit results</button><button type="button" class="btn danger" data-del="${esc(id)}">Undo edits</button></div>`
        : e[5] === "D" ? `<div class="evtools"><button type="button" class="btn" data-edit="${esc(id)}">Edit results</button></div>` : "";
      const body = open ? `<table class="evtable"><tbody>${e[6].map(t =>
        `<tr class="${S.hl != null && t[4].includes(S.hl) ? "hl" : ""} ${manual && !t[4].length ? "nc" : ""}"><td>${t[0]}</td><td>${esc(t[1])}${t[2] ? `<small>${esc(t[2])}</small>` : ""}</td><td>${f3(t[3])}</td></tr>`).join("")}</tbody></table>${tools}` : "";
      return `<div class="item" id="ev-${esc(id)}"><button type="button" class="evbtn" data-eid="${esc(id)}" aria-expanded="${open}">
        <span class="evdate">${esc(e[1])}</span><span class="evname">${esc(e[3])}<span class="tag">${esc(e[4])}</span>${e[7] === 1 && EDIT ? `<span class="tag mtag">Entered</span>` : e[7] === 2 && EDIT ? `<span class="tag mtag">Edited</span>` : ""}</span>
        <span class="nteams">${e[6].length} ${e[6].length === 1 ? "team" : "teams"}</span><span class="chev">›</span></button>${body}</div>`;
    }).join("");
    $("count").textContent = `${total} ${S.evtype === "D" ? "mixed doubles" : "four-person"} ${total === 1 ? "event" : "events"} · ${S.season} · newest first`;
  } else if(S.view === "pairs"){
    $("head").innerHTML = `<div class="colhead"><span style="text-align:center">Rank</span><span>Team</span><span>W / M</span><span>Points</span><span></span></div>`;
    let rows = ranked(D.pairs.map(([w, m, l], i) => ({i, w: D.people[w], m: D.people[m], l, t: D.people[w][3] + D.people[m][3]}))
      .sort((a, b) => b.t - a.t || a.l.localeCompare(b.l)));
    if(q) rows = rows.filter(r => fold(r.l + " " + r.w[0] + " " + r.m[0]).includes(q));
    total = rows.length;
    html = rows.map(r => {
      const open = S.open === "p" + r.i, added = D.pairs[r.i][3];
      return `<div class="item ${r.rank <= 3 ? "top" : ""}"><button type="button" class="rowbtn" data-k="p${r.i}" aria-expanded="${open}">
        <span class="rank">${r.rank}</span>
        <span class="who"><span class="teamname">${esc(r.l)}<span class="cnt">${r.w[4] + r.m[4]} of 14</span>${added && EDIT ? `<span class="tag mtag">Added</span>` : ""}</span><span class="names"><span><i class="mk w">W</i>${esc(r.w[0])}</span><span><i class="mk m">M</i>${esc(r.m[0])}</span></span></span>
        <span class="split num"><b>${f3(r.w[3])}</b><i>/</i><b>${f3(r.m[3])}</b></span>
        <span class="pts">${f3(r.t)}</span><span class="chev">›</span></button>
        ${open ? `<div class="panel">${athPanel(r.w)}${athPanel(r.m, "m")}</div>${added && EDIT ? `<div class="evtools"><button type="button" class="btn danger" data-rmteam="${esc(added)}">Remove team</button></div>` : ""}` : ""}</div>`;
    }).join("");
    $("count").textContent = `${total} registered teams · ${S.season}`;
  } else {
    $("head").innerHTML = `<div class="colhead"><span style="text-align:center">Rank</span><span>Athlete</span><span>Events</span><span>Points</span><span></span></div>`;
    const team = new Map(); D.pairs.forEach(p => { team.set(p[0], p[2]); team.set(p[1], p[2]); });
    const mdPts = p => p[5].some(e => e[0] === 0 && e[1] && e[3] > 0) || (p[6] || 0) > 0;
    let rows = D.people.map((p, i) => ({i, p, t: p[3], team: team.get(i)}))
      .filter(r => r.p[1] === S.view && r.p[2] && (r.team || mdPts(r.p)))
      .sort((a, b) => b.t - a.t || a.p[0].localeCompare(b.p[0]));
    rows = ranked(rows);
    const nAll = rows.length, nReg = rows.filter(r => r.team).length;
    if(q) rows = rows.filter(r => fold(r.p[0] + " " + (r.team || "")).includes(q));
    total = rows.length;
    const show = S.open != null ? rows : rows.slice(0, S.limit);
    html = show.map(r => {
      const open = S.open === "a" + r.i;
      return `<div class="item ${r.rank <= 3 ? "top" : ""}"><button type="button" class="rowbtn" data-k="a${r.i}" aria-expanded="${open}">
        <span class="rank">${r.rank}</span><span class="who"><span class="teamname">${esc(r.p[0])}</span><span class="names">${r.team ? `<span class="regtag">${esc(r.team)}</span>` : `<span class="regtag no">Not registered</span>`}</span></span>
        <span class="split num">${r.p[4]} of 7</span><span class="pts">${f3(r.t)}</span><span class="chev">›</span></button>
        ${open ? `<div class="panel single">${athPanel(r.p, S.view === "M" ? "m" : "")}</div>` : ""}</div>`;
    }).join("");
    $("count").textContent = `${nAll} Canadian ${S.view === "F" ? "women" : "men"} · ${nReg} on registered teams, ${nAll - nReg} not · ${S.season}`;
  }
  $("list").innerHTML = html || `<div class="empty">No matches for “${esc(S.q)}”. Clear the search to see everything.</div>`;
  $("more").hidden = !(S.view !== "pairs" && S.open == null && total > S.limit);
  drawAdmin();
}

function toast(msg, ms){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms || 5000); }

function q(s){ return s.replace(/</g, "\\u003c"); }
function buildDoc(readonly){
  const keep = [...document.querySelectorAll("[data-keep]")].map(n => n.outerHTML).join("");
  const sc = (id, type, text) => `<script id="${id}"${type ? ` type="${type}"` : ""}>${text}</scr` + `ipt>`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}</style></head><body>`
    + `<title>CMDR Rankings</title>` + keep + `<style id="css">${$("css").textContent}</style>`
    + `<template id="shell">${$("shell").innerHTML}</template><div id="app"></div>`
    + sc("data", "application/json", readonly ? q(JSON.stringify({[CUR]: JSON.parse($("data").textContent)[CUR]})) : $("data").textContent)
    + sc("meta", "application/json", q(JSON.stringify(readonly ? {...META, readonly: true} : META)))
    + sc("manual", "application/json", q(JSON.stringify(MANUAL)))
    + sc("teams", "application/json", q(JSON.stringify(TEAMS)))
    + sc("fours", "application/json", q(JSON.stringify(FOURS)))
    + sc("rosters", "application/json", $("rosters").textContent)
    + sc("nat", "application/json", $("nat").textContent)
    + sc("main", "", $("main").textContent)
    + `</body></html>`;
}
async function persist(note){
  applyManual(); DIRTY = true; draw();
  if(!ART){ toast(LOCAL ? `${note} Preview only – use Export entered results to keep it.` : `${note} Not saved: this view can't publish changes. Use Export entered results.`, 7000); return; }
  META.asof = todayISO(); setAsof();
  toast("Saving…", 60000);
  try{ await ART.publish(buildDoc()); DIRTY = false; SAVED_SIG = stateSig(); toast(`${note} Saved.`); drawAdmin(); }
  catch(err){
    const c = err && err.code;
    if(c === "conflict") toast("Someone saved a newer version first. The page has reloaded to it, so please enter this event again.", 9000);
    else if(c === "not_granted" || c === "not_writer"){ toast("You can view this page but not save to it. Use Export entered results to keep your entry.", 9000); }
    else toast(`Couldn't save (${c || "error"}). Your entry is still on screen; export it to be safe.`, 9000);
    drawAdmin();
  }
}
async function saveFile(filename, text, type){
  try{
    const dl = window.claude?.use ? await claude.use("downloads") : null;
    if(dl){ await dl.save({filename, data: text}); return true; }
  }catch(e){ if(e && e.code === "declined") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = filename; a.click();
  return true;
}
async function exportManual(){
  const text = JSON.stringify({events: MANUAL, teams: TEAMS, fours: FOURS}, null, 2);
  if(await saveFile("cmdr_manual_events.json", text, "application/json")){ SAVED_SIG = stateSig(); }
}

  if(DIRTY && !confirm("Some changes on this page aren't saved yet. The public version will include them anyway. Continue?")) return;
  if(await saveFile(`cmdr_rankings_public_${todayISO()}.html`, buildDoc(true), "text/html"))
    toast("Public version downloaded. Post that file; nobody can change it.");
}

/* ------------------------------------------------------------ bringing in someone else's changes */
const stateSig = () => JSON.stringify([MANUAL, TEAMS, FOURS]);
let SAVED_SIG = stateSig();
window.addEventListener("beforeunload", e => { if(EDIT && stateSig() !== SAVED_SIG){ e.preventDefault(); e.returnValue = ""; } });
const evKey = e => e.replaces ? "r:" + e.replaces : "i:" + e.id;
const tmKey = t => fold(t.w) + "|" + fold(t.m);
const frKey = o => o.replaces ? `r:${fold(o.who)}|${o.replaces.name}|${o.replaces.season}|${r3(o.replaces.pts)}` : "i:" + o.id;
function diffBy(mine, theirs, key, label){
  const M = new Map(mine.map(x => [key(x), x])), T = new Map(theirs.map(x => [key(x), x]));
  const out = {added: [], changed: [], mineOnly: []};
  for(const [k, t] of T){ const m = M.get(k); if(!m) out.added.push(label(t)); else if(JSON.stringify(m) !== JSON.stringify(t)) out.changed.push(label(t)); }
  for(const [k, m] of M) if(!T.has(k)) out.mineOnly.push(label(m));
  return out;
}
function mergeBy(mine, theirs, key){
  const T = new Map(theirs.map(x => [key(x), x])), mk = new Set(mine.map(key));
  return mine.map(x => T.get(key(x)) || x).concat(theirs.filter(x => !mk.has(key(x))));
}
function readImport(text, name){
  if(/\.html?$/i.test(name || "") || /^\s*</.test(text)){
    const doc = new DOMParser().parseFromString(text, "text/html");
    if(!doc.getElementById("manual")) throw new Error("that page has no CMDR results in it");
    const g = id => { const n = doc.getElementById(id); return n ? JSON.parse(n.textContent) : []; };
    return {events: g("manual"), teams: g("teams"), fours: g("fours")};
  }
  const j = JSON.parse(text);
  if(Array.isArray(j)) return {events: j, teams: [], fours: []};
  if(!j || typeof j !== "object" || !("events" in j)) throw new Error("it isn't a CMDR export");
  return {events: j.events || [], teams: j.teams || [], fours: j.fours || []};
}
function openImport(){
  $("dlgbody").innerHTML = `
    <header><h2 id="dlgtitle">Bring in changes</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="body">
      <p class="hint" style="margin:0">Use what someone sent back: their exported <b>cmdr_manual_events.json</b>, or a copy of this page they saved.</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="i-pick">Choose file…</button><span class="hint" id="i-name"></span></div>
      <label class="field">Or paste the exported text<textarea id="i-text" style="min-height:80px"></textarea></label>
      <button type="button" class="btn" id="i-read" style="justify-self:start">Compare</button>
      <div id="i-sum"></div>
      <p class="err" id="e-err" hidden></p>
    </div>
    <footer><span class="sum"></span><button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="button" class="btn" id="i-replace" hidden>Replace with theirs</button>
      <button type="button" class="btn primary" id="i-merge" hidden>Bring in their changes</button></footer>`;
  let got = null, src = "";
  const compare = (text, name) => {
    $("e-err").hidden = true;
    try{ got = readImport(text, name); }catch(err){ got = null; $("i-sum").innerHTML = ""; $("i-merge").hidden = $("i-replace").hidden = true; return showErr(`Couldn't read ${name || "that text"}: ${err.message}.`); }
    src = name || "pasted text";
    const parts = [diffBy(MANUAL, got.events, evKey, e => e.replaces ? `${e.name} (edited)` : e.name),
                   diffBy(TEAMS, got.teams, tmKey, t => `Team ${t.label}`),
                   diffBy(FOURS, got.fours, frKey, o => `${o.who}: four-person ${o.name} ${f3(o.pts)}`)];
    const all = k => parts.flatMap(p => p[k]);
    const sec = (title, arr, note) => arr.length ? `<h4 style="margin:10px 0 4px;font-size:13px">${title} (${arr.length})</h4>${note ? `<p class="hint" style="margin:0 0 4px">${note}</p>` : ""}
      <ul style="margin:0;padding-left:18px;font-size:14px">${arr.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join("")}${arr.length > 12 ? `<li class="hint">and ${arr.length - 12} more</li>` : ""}</ul>` : "";
    const add = all("added"), chg = all("changed"), mine = all("mineOnly");
    $("i-sum").innerHTML = add.length || chg.length
      ? sec("New", add) + sec("Changed", chg, "Their version replaces yours.") + sec("Only on yours", mine, "Bring in their changes keeps these. Replace with theirs removes them.")
      : `<p style="margin:0">Nothing new: everything in ${esc(src)} is already on this page.${mine.length ? ` You have ${mine.length} ${mine.length === 1 ? "entry" : "entries"} they don't.` : ""}</p>`;
    $("i-merge").hidden = !(add.length || chg.length);
    $("i-replace").hidden = !(add.length || chg.length || mine.length);
  };
  $("i-pick").onclick = () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,.html,.htm,application/json,text/html";
    inp.onchange = async () => { const f = inp.files[0]; if(!f) return; $("i-name").textContent = f.name; compare(await f.text(), f.name); };
    inp.click();
  };
  $("i-read").onclick = () => compare($("i-text").value, "");
  $("i-merge").onclick = async () => {
    MANUAL = mergeBy(MANUAL, got.events, evKey); TEAMS = mergeBy(TEAMS, got.teams, tmKey); FOURS = mergeBy(FOURS, got.fours, frKey);
    $("dlg").close(); await persist(`Brought in changes from ${src}.`);
  };
  $("i-replace").onclick = async () => {
    if(!confirm("Replace everything entered on this page with their version? Entries only you have will be removed.")) return;
    MANUAL = got.events; TEAMS = got.teams; FOURS = got.fours;
    $("dlg").close(); await persist(`Replaced with ${src}.`);
  };
  $("dlg").showModal();
}

async function deleteManual(eid){
  const m = MANUAL.find(x => "m" + x.id === eid || String(x.replaces) === eid); if(!m) return;
  const undo = !!m.replaces;
  if(!confirm(undo ? `Undo your edits to “${m.name}” and go back to the original results?` : `Delete “${m.name}” and remove its points from the rankings?`)) return;
  MANUAL = MANUAL.filter(x => x !== m); if(!undo) S.open = null;
  await persist(undo ? `Restored ${m.name}.` : `Deleted ${m.name}.`);
}

async function removeTeam(id){

  await persist(`Removed ${t.label}.`);
}
function teamLabel(w, m){ const last = n => n.trim().split(/\s+/).slice(1).join(" "); return w.trim() && m.trim() ? `${last(w)}/${last(m)}` : ""; }
function openTeam(){

  const women = [...new Set(D.people.filter(p => p[1] === "F").map(p => p[0]))].sort();

function matchLabel(label){
  const P = pairsCur(), F = personFinder(), D = DATA[CUR];
  const parts = label.split(/\s*[\/&]\s*|\s+and\s+/i).map(s => s.trim()).filter(Boolean);
  const hit = (part, full) => { const f = fold(part); return f === fold(full) || f === surname(full); };
  if(parts.length === 2){
    for(const p of P) if((hit(parts[0], p.w) && hit(parts[1], p.m)) || (hit(parts[0], p.m) && hit(parts[1], p.w)))
      return {sel: "pair:" + p.i, w: p.w, m: p.m};
    let w = "", m = "";
    for(const part of parts){ const i = F.find(part); if(i >= 0){ if(D.people[i][1] === "F") w = D.people[i][0]; else m = D.people[i][0]; } }
    if(w || m) return {sel: "other", w, m};
    return {sel: "other", w: parts[0], m: parts[1]};
  }
  const one = parts[0] || "";
  const i = F.find(one);
  if(i >= 0){
    const nm = D.people[i][0], g = D.people[i][1];
    const p = P.find(p => fold(g === "F" ? p.w : p.m) === fold(nm));
    if(p) return {sel: "pair:" + p.i, w: p.w, m: p.m};
    return {sel: "other", w: g === "F" ? nm : "", m: g === "M" ? nm : ""};
  }
  const bySur = P.filter(p => surname(p.w) === fold(one) || surname(p.m) === fold(one));
  if(bySur.length === 1) return {sel: "pair:" + bySur[0].i, w: bySur[0].w, m: bySur[0].m};
  // a single unknown name: CurlingZone lists doubles teams under the woman
  return one.includes(" ") ? {sel: "other", w: one, m: ""} : {sel: "none", w: "", m: ""};
}

let PARTNERS = null;   // fold(name) -> most recent doubles partner seen in the data
function lastPartner(name){
  if(!PARTNERS){
    PARTNERS = new Map(); const when = new Map();
    for(const s of SEASONS){ const D = DATA[s];
      for(const e of D.events){ if(e[5] !== "D") continue;
        for(const t of e[6]){ if(t[4].length !== 2) continue;
          const [a, b] = t[4].map(i => D.people[i][0]);
          for(const [x, y] of [[a, b], [b, a]]){ const k = fold(x);
            if(!when.has(k) || e[2] > when.get(k)){ when.set(k, e[2]); PARTNERS.set(k, y); } } } } }
  }
  return PARTNERS.get(fold(name)) || "";
}

    const p = lastPartner(r.w || r.m), F = personFinder();
    if(p && F.find(p, r.w ? "M" : "F") >= 0){ if(r.w) r.m = p; else r.w = p; r.sugg = 1; }
  }
  return r;
}

function parseStandings(text){ return parseRows(text).map(r => withPartner({...r, ...matchLabel(r.label)})); }
function parseRows(text){
  const rows = [];
  for(const raw of text.split(/\r?\n/)){
    const line = raw.replace(/ /g, " ").trim();
    const m = line.match(/^(?:T-?)?(\d+)\.?\s+(.*)$/);
    if(!m) continue;
    const rank = +m[1];
    let rest = m[2], fields = rest.split(/\t+/).map(s => s.trim()).filter(Boolean);
    if(fields.length < 2){
      const mm = rest.match(/^(.*?)(?:\s+\$[\d,]+(?:\.\d+)?)?(?:\s+(\d+(?:\.\d+)?))?\s*$/);
      fields = [mm[1], mm[2] || ""];
    }
    const team = fields[0];
    const nums = fields.slice(1).filter(f => !f.startsWith("$") && /^\d+(?:\.\d+)?$/.test(f.replace(/,/g, "")));
    const pts = nums.length ? +nums[nums.length - 1].replace(/,/g, "") : 0;
    if(!team) continue;
    rows.push({rank, label: team, pts});
  }
  return rows;
}

  const P = pairsCur(), D = DATA[CUR];
  const women = [...new Set(D.people.filter(p => p[1] === "F").map(p => p[0]))].sort();
  const men = [...new Set(D.people.filter(p => p[1] === "M").map(p => p[0]))].sort();
  const counted = DR.rows.filter(rowWho).length, editing = !!DR.replaces;
  const opts = r => `<optgroup label="${CUR} registered teams">${P.map(p => `<option value="pair:${p.i}" ${r.sel === "pair:" + p.i ? "selected" : ""}>${esc(p.l)}</option>`).join("")}</optgroup>
     <option value="other" ${r.sel === "other" ? "selected" : ""}>Other athletes…</option>
     <option value="none" ${r.sel === "none" ? "selected" : ""}>Not counted</option>`;
  const rowsHtml = DR.rows.map((r, j) => {
    const who = rowWho(r);
    return `<tr data-j="${j}">
      <td class="r"><input type="number" min="1" step="1" value="${esc(r.rank)}" data-f="rank" aria-label="Rank"></td>
      <td class="lab">${esc(r.label) || `<span class="hint">Pick a team →</span>`}<span class="chip ${who ? "ok" : "no"}">${!who ? "Not counted" : who.n === 2 ? "Counts" : "Partner not entered"}</span>${who && r.sugg ? `<span class="hint">Partner suggested from their most recent doubles event — check it.</span>` : ""}</td>
      <td class="match"><select data-f="sel" aria-label="Counts for">${opts(r)}</select>
        ${r.sel === "other" ? `<div class="who2"><input list="dl-w" placeholder="Woman" value="${esc(r.w)}" data-f="w" aria-label="Woman"><input list="dl-m" placeholder="Man" value="${esc(r.m)}" data-f="m" aria-label="Man"></div>` : ""}</td>
      <td class="p"><input type="number" min="0" step="0.001" value="${esc(r.pts)}" data-f="pts" aria-label="Team points"></td>
      <td class="each">${who ? f3(eachPts(r, who)) : "–"}</td>
      <td class="x2"><button type="button" class="x" data-rm="${j}" aria-label="Remove row">×</button></td></tr>`;
  }).join("");
  $("dlgbody").innerHTML = `
    <header><h2 id="dlgtitle">${DR.id || editing ? "Edit results" : "Add results"}</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="body">
      <div class="fgrid">
        <div class="field">Event type<div class="seg"><button type="button" aria-pressed="true">Mixed doubles</button><button type="button" id="to-four" ${DR.id || editing ? "disabled" : ""}>Four-person</button></div></div>
        <label class="field wide">Event name<input id="e-name" value="${esc(DR.name)}" placeholder="e.g. Goldline Mixed Doubles Montreal"></label>
        ${editing ? `<div class="field">Dates<span style="font-weight:400;color:var(--ink);font-size:14px;padding:8px 0">${esc(DR.dateLabel || "—")}</span><input id="e-start" type="hidden" value="${esc(DR.start)}"><input id="e-end" type="hidden" value="${esc(DR.end)}"></div><div></div>`
        : `<label class="field">Start date<input id="e-start" type="date" min="${SEASON_FROM}" max="${SEASON_TO}" value="${esc(DR.start)}"></label>
        <label class="field">End date<input id="e-end" type="date" min="${SEASON_FROM}" max="${SEASON_TO}" value="${esc(DR.end)}"></label>`}
      </div>
      <div class="paste">
        <label class="field">Paste final standings from CurlingZone<textarea id="e-paste" placeholder="1.&#9;Katie Ford&#9;$1,500&#9;12.000&#10;2.&#9;Megan Smith&#9;$1,200&#9;8.800">${esc(DR.paste)}</textarea></label>
        <div class="row"><button type="button" class="btn" id="e-read">Read standings</button>
          <p class="hint">Rows are matched to ${CUR} registered teams where possible. Reading replaces the table below.</p></div>
      </div>
      <div>
        <table class="dtable"><thead><tr><th>Rank</th><th>Team as listed</th><th>Counts for</th><th>Team pts</th><th>Each</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
        <p class="hint" style="margin-top:6px">Each athlete receives ${MD_SHARE * 100}% of the team's points. If only one athlete is entered, only they get points. Teams that don't count still appear in the event's results.${editing ? " Rows you leave unchanged keep each athlete's current points." : ""}</p>
        <button type="button" class="btn" id="e-add" style="margin-top:8px">+ Add team</button>
      </div>
      <p class="err" id="e-err" hidden></p>
    </div>
    <footer><span class="sum">${DR.rows.length} teams · ${counted} counted toward rankings</span>
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="button" class="btn primary" id="e-save">${DR.id || editing ? "Save changes" : "Save event"}</button></footer>
    <datalist id="dl-w">${women.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <datalist id="dl-m">${men.map(n => `<option value="${esc(n)}">`).join("")}</datalist>`;
}
function syncHeader(){
  DR.name = $("e-name").value; DR.start = $("e-start").value; DR.end = $("e-end").value; DR.paste = $("e-paste").value;
}
$("dlg").addEventListener("click", e => {
  if(e.target.closest("[data-close]")){ $("dlg").close(); return; }
  if(e.target.id === "to-four"){ syncHeader(); openFourEntry(null, {name: DR.name, start: DR.start, end: DR.end, paste: DR.paste}); return; }
  if(e.target.id === "e-read"){
    syncHeader(); const rows = parseStandings(DR.paste);
    if(!rows.length){ showErr("No standings rows found. Each row should start with a rank, like “1. Team name … points”."); return; }
    DR.rows = rows; drawEntry(); return;
  }
  if(e.target.id === "e-add"){ syncHeader();
    const used = new Set(DR.rows.map(r => r.sel)), p = pairsCur().find(p => !used.has("pair:" + p.i));
    DR.rows.push({rank: DR.rows.length + 1, label: "", pts: "", sel: p ? "pair:" + p.i : "none", w: p ? p.w : "", m: p ? p.m : ""});
    Object.assign(DR.rows[DR.rows.length - 1], {label: p ? p.l : "", autolabel: 1}); drawEntry(); return; }
  const rm = e.target.closest("[data-rm]"); if(rm){ syncHeader(); DR.rows.splice(+rm.dataset.rm, 1); drawEntry(); return; }
  if(e.target.id === "e-save") saveEntry();
});
$("dlg").addEventListener("change", e => {
  const f = e.target.dataset.f, tr = e.target.closest("tr[data-j]"); if(!f || !tr) return;
  syncHeader();
  const r = DR.rows[+tr.dataset.j];
  if(f === "sel"){ r.sel = e.target.value;
    if(r.sel.startsWith("pair:")){ const p = pairsCur().find(p => "pair:" + p.i === r.sel); r.w = p.w; r.m = p.m; if(!r.label || r.autolabel) { r.label = p.l; r.autolabel = 1; } }
    else if(r.autolabel){ r.label = ""; } }
  else if(f === "rank") r.rank = +e.target.value;
  else if(f === "pts") r.pts = e.target.value;
  else { r[f] = e.target.value; r.sugg = 0; }
  drawEntry();
});
function showErr(msg){ const el = $("e-err"); el.textContent = msg; el.hidden = false; el.scrollIntoView({block: "nearest"}); }
function unchanged(r, who){
  const o = r.orig; if(!o || !o.ath) return false;
  return +o.pts === +(r.pts || 0) && fold(o.w) === fold(who.w) && fold(o.m) === fold(who.m);
}
function eachPts(r, who){
  if(unchanged(r, who)){ const v = Object.values(r.orig.ath); if(v.length) return v[0]; }
  return r3((+r.pts || 0) * MD_SHARE);
}
async function saveEntry(){
  syncHeader();
  const name = DR.name.trim(), editing = !!DR.replaces, start = DR.start, end = DR.end || DR.start;
  if(!name) return showErr("Give the event a name.");
  if(!editing && start && (start < SEASON_FROM || start > SEASON_TO)) return showErr(`New results count toward ${CUR}, so the date must fall between ${dateLabel(SEASON_FROM)} and ${dateLabel(SEASON_TO)}.`);
  if(!editing && end && start && end < start) return showErr("The end date is before the start date.");
  if(!DR.rows.length) return showErr("Add at least one team.");
  const seen = new Set(), teams = [];
  for(const r of DR.rows){
    const pts = r.pts === "" || r.pts == null ? 0 : +r.pts;
    if(!(pts >= 0)) return showErr(`Check the points for “${r.label || "a team"}”.`);
    if(!(r.rank >= 1)) return showErr(`Check the rank for “${r.label || "a team"}”.`);
    const who = rowWho(r);
    if(who){ for(const n of [who.w, who.m].filter(Boolean)){ const k = fold(n); if(seen.has(k)) return showErr(`${n} appears on two teams in this event.`); seen.add(k); } }
    const t = {rank: +r.rank, label: r.label || (who ? [who.w, who.m].filter(Boolean).join(" / ") : "Team"), pts: r3(pts),
               w: who && who.w ? who.w : null, m: who && who.m ? who.m : null};
    if(who && unchanged(r, who)) t.ath = r.orig.ath;
    teams.push(t);
  }
  const ev = {id: DR.id || String(Date.now()), type: "D", name, start: start || "", end: end || "", added: todayISO(), teams};
  if(editing) Object.assign(ev, {replaces: DR.replaces, season: DR.season, dateLabel: DR.dateLabel, tag: DR.tag});
  MANUAL = DR.id ? MANUAL.map(m => m.id === DR.id ? ev : m) : MANUAL.concat([ev]);
  const openId = editing ? DR.replaces : "m" + ev.id;
  $("dlg").close();
  Object.assign(S, {season: CUR, view: "events", evtype: "D", open: openId, hl: null, q: ""}); $("q").value = "";
  await persist(`${DR.id || editing ? "Updated" : "Added"} ${name}.`);
  const el = $("ev-" + openId); if(el) el.scrollIntoView({block: "start"});
}
$("addbtn").addEventListener("click", () => openEntry(null));

/* ------------------------------------------------------------ start */
setAsof();
applyManual();
draw();
if(LOCAL && !META.readonly){ EDIT = true; drawAdmin(); }
(async () => {
  if(META.readonly || !window.claude?.use) return;
  const [u, art] = await Promise.all([claude.use("user"), claude.use("artifact")]);
  ART = art;
  const can = u ? (u.isOwner() || u.canEdit()) : false;
  if(ART && can){ EDIT = true; draw(); }
})();
